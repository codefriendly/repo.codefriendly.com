# Reviewed license choices for Strata's native Rust dependency graph.
# A new license outside this list requires review before the build can pass.
accepted = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "ISC",
  "BSD-2-Clause", "BSD-3-Clause", "bzip2-1.0.6", "CC0-1.0",
  "CDLA-Permissive-2.0", "MIT-0", "Unicode-3.0", "Unlicense", "Zlib",
]
ignore-dev-dependencies = true
workarounds = ["chrono"]

# Fetch omitted notices from the exact Git commit recorded in each crate.
# A changed notice fails its checksum and requires review.
